<div class="container">
  <section class="hero">
    <h1>Welcome to Sports Marketplace</h1>
    <p>Buy and sell old and new sports gear, apparel, and collectibles with ease.</p>
  </section>

  <section class="form-section">
    <div class="input-group">
      <text-box label="Search the marketplace"
                type="text"
                id="search"
                class="text-input"
                placeholder="e.g., basketball shoes, cricket bat..."
      ></text-box>
    </div>
    <primary-button text="Search"></primary-button>
  </section>

  <section class="form-section">
    <div class="btn-group">
      <primary-button text="Add a product" routerLink="/add-product"></primary-button>
      <primary-button text="Visit a forum" routerLink="/forums"></primary-button>
      <primary-button text="Explore events" routerLink="/events"></primary-button>
    </div>
  </section>
</div>
