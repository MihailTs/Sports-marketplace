<a *ngIf="routerLink; else normalButton"
   [routerLink]="routerLink"
   [ngClass]="['primary-btn', class]">
  {{ text }}
</a>

<ng-template #normalButton>
  <button [type]="type"
          (click)="handleClick()"
          [ngClass]="['primary-btn', class]">
    {{ text }}
  </button>
</ng-template>
