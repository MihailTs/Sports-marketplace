<div class="forum-container" (click)="goToForum()">
  <h2>{{ forumContent.title }}</h2>
  <p class="description">{{ forumContent.description }}</p>
  <p class="sport">Sport: {{ forumContent.sport.name }}</p>
  <p class="timestamps">
    Started: {{ forumContent.createdAt | date:'short' }} |
    Updated: {{ forumContent.updatedAt | date:'short' }}
  </p>
</div>
