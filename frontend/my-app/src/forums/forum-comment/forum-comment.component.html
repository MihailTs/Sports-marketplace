<div class="comment-card">
  <div class="comment-header">
    <p><a [routerLink]="['/users', comment.userId]">
      {{ comment.name }}
    </a></p>
    <span class="date">{{ comment.createdAt | date:'short' }}</span>
  </div>
  <div class="comment-content">
    {{ comment.content }}
  </div>
</div>
